function compute(eid,grade,all){var e=ex(eid);if(!e)return[];
 var rows=S.learners.filter(function(l){return l.grade==grade&&(all||!S.stream||l.stream==S.stream)}).map(function(l){var sc=[],tot=0,pc=0,pts=0,n=0;

 var rows=compute(S.exam,S.grade),rk=rows.filter(function(r){return r.avg!=null});

 var dist={};rk.forEach(function(r){dist[r.lvl]=(dist[r.lvl]||0)+1});var mx=Math.max.apply(null,Object.keys(dist).map(function(k){return dist[k]}));
